name: Publicar banco

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: publicar-banco
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Conferir configuração
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Configure os segredos SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD e a variável SUPABASE_PROJECT_REF em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Ligar ao projeto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Aplicar migrations
        run: supabase db push
