name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci

      - name: Subir o Supabase local
        run: supabase start

      - name: Testes de banco
        run: supabase test db

      - name: Testes unitários
        run: npm run test:unit

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Variáveis do Supabase local
        run: |
          supabase status -o env | awk -F= '
            $1=="API_URL"  {print "NEXT_PUBLIC_SUPABASE_URL=" $2}
            $1=="ANON_KEY" {print "NEXT_PUBLIC_SUPABASE_ANON_KEY=" $2}
          ' | tr -d '"' >> "$GITHUB_ENV"
          echo "SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Testes e2e
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
