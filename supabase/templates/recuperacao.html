<!doctype html>
<!-- Pinha · recuperação de senha. Cores = tokens do tema claro (design/tokens.json): e-mail não lê CSS variables. -->
<html lang="pt-BR">
  <body style="margin:0;padding:24px 16px;background:#f4f6f4;font-family:Manrope,Arial,Helvetica,sans-serif;color:#13201c;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;">
      <tr>
        <td style="padding:32px 24px;">
          <p style="margin:0 0 24px;font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:32px;letter-spacing:-0.03em;color:#0f3d33;">pinha</p>
          <h1 style="margin:0 0 12px;font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-size:24px;line-height:30px;">Redefinir senha</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:24px;">Recebemos um pedido para trocar a senha da sua conta. Toque no botão para escolher uma nova.</p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
               style="display:inline-block;padding:14px 20px;border-radius:8px;background:#0f6e56;color:#ffffff;font-weight:700;font-size:15px;text-decoration:none;">Escolher nova senha</a>
          </p>
          <p style="margin:0 0 24px;font-size:14px;line-height:20px;color:#56665f;">Se não foi você que pediu, ignore este e-mail. Sua senha continua a mesma.</p>
          <p style="margin:0;font-size:12px;line-height:16px;font-weight:600;color:#56665f;">by PINDev</p>
        </td>
      </tr>
    </table>
  </body>
</html>
